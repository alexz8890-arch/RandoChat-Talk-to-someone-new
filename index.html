<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b1020">

<title>راندو تشات ⚡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#070b14;
--panel:#111827;
--panel2:#172033;
--primary:#38bdf8;
--blue:#2563eb;
--green:#10b981;
--pink:#ec4899;
--red:#ef4444;
--muted:#94a3b8;
--line:rgba(255,255,255,.09);
--shadow:0 24px 80px rgba(0,0,0,.45)
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Tajawal,sans-serif
}

body{
min-height:100vh;
background:
radial-gradient(circle at 20% 0,#20245d 0,#070b14 48%,#03050a 100%);
color:#f8fafc;
padding:10px
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer
}

.app{
width:min(100%,520px);
height:calc(100vh - 20px);
margin:auto;
background:rgba(13,19,32,.94);
border:1px solid var(--line);
border-radius:26px;
overflow:hidden;
box-shadow:var(--shadow);
position:relative
}

.screen{
height:100%;
display:flex;
flex-direction:column;
padding:18px;
overflow:auto
}

.hidden{
display:none!important
}

.brand{
text-align:center;
font-size:29px;
font-weight:800;
color:var(--primary);
margin-top:8px
}

.sub{
text-align:center;
color:var(--muted);
font-size:13px;
margin:4px 0 18px
}

.tabs{
display:flex;
gap:7px;
margin-bottom:14px
}

.tab{
flex:1;
padding:10px;
border:1px solid var(--line);
background:#0d1422;
color:#fff;
border-radius:12px
}

.tab.active{
background:linear-gradient(135deg,#0284c7,#2563eb)
}

label{
display:block;
color:var(--muted);
font-size:12px;
margin:0 0 6px
}

.group{
margin-bottom:11px
}

input,select,textarea{
width:100%;
border:1px solid var(--line);
background:#0a1220;
color:#fff;
border-radius:12px;
padding:12px;
outline:none;
transition:.18s
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--primary);
box-shadow:0 0 0 2px rgba(56,189,248,.08)
}

.input-error{
border-color:#ef4444!important;
box-shadow:0 0 0 2px rgba(239,68,68,.12)!important
}

.field-error{
color:#fca5a5;
font-size:11px;
margin-top:4px;
min-height:15px
}

textarea{
min-height:72px;
resize:vertical
}

.row{
display:flex;
gap:8px
}

.row>*{
flex:1
}

.btn{
width:100%;
border:0;
border-radius:12px;
padding:12px;
color:#fff;
font-weight:800;
background:linear-gradient(135deg,#0284c7,#2563eb);
margin-top:4px;
transition:.15s
}

.btn:active{
transform:scale(.98)
}

.btn.secondary{
background:#202b3f
}

.btn.green{
background:#059669
}

.btn.red{
background:#dc2626
}

.btn.pink{
background:#db2777
}

.btn.small{
width:auto;
padding:8px 11px;
font-size:12px
}

.avatarbox{
text-align:center;
margin-bottom:12px
}

.avatar{
width:84px;
height:84px;
border-radius:50%;
object-fit:cover;

background:#0b1220
}

.file{

margin-top:7px;
padding:7px 13px;
border-radius:20px;
background:#202b3f;

}

.file input{
display:none

.header{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line);
padding-bottom:11px;
margin-bottom:12px;
gap:8px

.me{

.me img{

height:38px;

.me span{

.rooms{

.room{

.room:active{

.room h3{

.room p{

.messages{

overflow:auto;

gap:9px;

.bubble{

.bubble.mine{

}

.bubble:not(.mine){
border-bottom-left-radius:4px

.meta{
display:flex;
align-items:center;
gap:6px;
font-size:10px;
color:#cbd5e1;
margin-bottom:4px

.meta img{
width:23px;
height:23px;
border-radius:50%;

.msgtext{
white-space:pre-wrap;

}

.msgimg{
display:block;
max-width:230px;
border-radius:12px;

.composer{
display:flex;
gap:6px;
padding-top:8px
}

.composer input{
flex:1

.icon{
width:42px;
height:42px;
border:1px solid var(--line);
background:#172033;
color:#fff;
border-radius:11px;
display:flex;
align-items:center;
justify-content:center
}

.send{
width:48px;
height:42px;
border:0;
border-radius:11px;
background:#0284c7;
color:#fff;
font-size:18px
}

.modal{
position:absolute;
inset:0;
background:rgba(0,0,0,.78);
backdrop-filter:blur(9px);
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:50
}

.card{
width:min(100%,390px);
max-height:90vh;
overflow:auto;
background:#111827;
border:1px solid var(--line);
border-radius:22px;
padding:18px;
text-align:center
}

.bigavatar{
width:92px;
height:92px;
border-radius:50%;

border:3px solid var(--primary)

.bio{
background:#0a1220;
border:1px dashed var(--line);
padding:10px;
border-radius:12px;
color:var(--muted);

margin:10px 0;
text-align:right
}

.notice{
font-size:12px;
padding:9px;
border-radius:10px;
background:#10243a;
color:#bae6fd;
margin-bottom:10px

.notice.error{

.online{

.role{
font-size:10px;

#toast{
position:absolute;
left:14px;
right:14px;
bottom:14px;
background:#0f172a;
border:1px solid var(--line);
padding:11px;
border-radius:12px;

.loading{
position:absolute;

z-index:200;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
color:var(--primary)
}

.empty{
text-align:center;
color:var(--muted);
padding:30px 10px;

</style>

  <script>

const SUPABASE_URL =
'https://wiahoicutalnheblndek.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ3aWFob2ljdXRhbG5oZWJsbmRla1cifQ.unasXFy1XiJyxrliCarNJs9eC2FEJ_6UrNzWq4myvhA';

const sb = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


let authMode='login';

let currentUser=null;
let currentProfile=null;

let currentRoom=null;
let currentRoomChannel=null;

let dmTarget=null;
let dmChannel=null;

let selectedProfile=null;


/* =====================================================
HELPERS
===================================================== */

const $ = id => document.getElementById(id);


function show(id){
$(id)?.classList.remove('hidden');
}


function hide(id){
$(id)?.classList.add('hidden');
}


function loading(value){
$('loading').classList.toggle('hidden',!value);
}


function toast(message,error=false){

const el=$('toast');

el.textContent=message;

el.style.background=
error ? '#3b1015' : '#0f172a';

el.classList.remove('hidden');

clearTimeout(window.__toastTimer);

window.__toastTimer=setTimeout(()=>{
el.classList.add('hidden');
},3000);

}


function safe(value){

return String(value ?? '')
.replace(/[&<>"']/g,char=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[char]));

}


/* =====================================================
AUTH MODE
===================================================== */

function setAuthMode(mode){

authMode=mode;

$('tabLogin').classList.toggle(
'active',
mode==='login'
);

$('tabSignup').classList.toggle(
'active',
mode==='signup'
);

$('signupFields').classList.toggle(
'hidden',
mode==='login'
);

$('authBtn').textContent=
mode==='login'
?'دخول المنصة 🚀'
:'إنشاء الحساب 🚀';

clearErrors();

$('authNotice').textContent=
mode==='login'
?'أدخل اسم المستخدم وكلمة السر للدخول.'
:'أنشئ حسابك مجاناً. الحقول المطلوبة ستظهر بالأحمر إذا كانت ناقصة.';

}


/* =====================================================
ERRORS
===================================================== */

function clearErrors(){

[
'username',
'password',
'age',
'gender',
'country',
'bio'
].forEach(id=>{
$(id)?.classList.remove('input-error');
});

[
'usernameError',
'passwordError',
'ageError',
'genderError',
'countryError',
'bioError',
'avatarError'
].forEach(id=>{
if($(id))$(id).textContent='';
});

}


function fieldError(
inputId,
errorId,
message
){

$(inputId)?.classList.add('input-error');

if($(errorId)){
$(errorId).textContent=message;
}

}


function validateLogin(){

clearErrors();

let ok=true;

const name=$('username').value.trim();
const pass=$('password').value;

if(name.length<3){

fieldError(
'username',
'usernameError',
'اكتب اسم المستخدم.'
);

ok=false;

}

if(!pass){

fieldError(
'password',
'passwordError',
'اكتب كلمة السر.'
);

ok=false;

}

return ok;

}


function validateSignup(){

clearErrors();

let ok=true;

const name=$('username').value.trim();

const pass=$('password').value;

const age=Number($('age').value);

const gender=$('gender').value;

const country=$('country').value;

const file=$('avatarFile').files?.[0];


if(name.length<3){

fieldError(
'username',
'usernameError',
'اسم المستخدم يجب أن يكون 3 أحرف على الأقل.'
);

ok=false;

}


if(name.length>24){

fieldError(
'username',
'usernameError',
'اسم المستخدم طويل جداً.'
);

ok=false;

}


if(!/^[\p{L}\p{N}_]+$/u.test(name)){

fieldError(
'username',
'usernameError',
'استخدم الحروف والأرقام والشرطة السفلية فقط.'
);

ok=false;

}


if(pass.length<8){

fieldError(
'password',
'passwordError',
'كلمة السر يجب أن تكون 8 أحرف على الأقل.'
);

ok=false;

}


if(pass.length>72){

fieldError(
'password',
'passwordError',
'كلمة السر طويلة جداً.'
);

ok=false;

}


if(!Number.isInteger(age)||age<13||age>120){

fieldError(
'age',
'ageError',
'العمر يجب أن يكون بين 13 و120.'
);

ok=false;

}


if(!gender){

fieldError(
'gender',
'genderError',
'اختر الجنس.'
);

ok=false;

}


if(!country){

fieldError(
'country',
'countryError',
'اختر البلد.'
);

ok=false;

}


if(file){

try{
validateImage(file);
}catch(error){

fieldError(
'avatarFile',
'avatarError',
error.message
);

ok=false;

}

}

return ok;

}


/* =====================================================
INTERNAL EMAIL
===================================================== */

function internalEmail(username){

const normalized=
username.trim().toLowerCase();

const encoded=
encodeURIComponent(normalized);

return `${encoded}@randochat.internal`;

}


/* =====================================================
IMAGE
===================================================== */

function validateImage(file){

if(
![
'image/jpeg',
'image/png',
'image/webp'
].includes(file.type)
){

throw new Error(
'الصورة يجب أن تكون JPG أو PNG أو WEBP.'
);

}

if(file.size>4*1024*1024){

throw new Error(
'حجم الصورة يجب ألا يتجاوز 4MB.'
);

}

}


async function uploadImage(
file,
userId,
folder
){

validateImage(file);

async function submitAuth(){

clearErrors();

if(authMode==='login'){

if(!validateLogin()){

toast(
'أكمل البيانات المطلوبة أولاً.',
true
);

return;

}

}else{

if(!validateSignup()){

toast(
'في حقول ناقصة أو غير صحيحة.',
true
);

return;

}

}

loading(true);

try{

const name=
$('username').value.trim();

const pass=
$('password').value;

const email=
internalEmail(name);


/* LOGIN */

if(authMode==='login'){

const {
data,
error
}=
await sb.auth.signInWithPassword({
email,
password:pass
});

if(error)throw error;

await loadUser(data.user);

toast('تم تسجيل الدخول بنجاح ⚡');

return;

}


/* SIGNUP */

const {
data,
error
}=
await sb.auth.signUp({

email,

password:pass,

options:{
data:{
username:name
}
}

});

if(error)throw error;

if(!data.user){

throw new Error(
'تعذر إنشاء الحساب.'
);

}


/*
إذا كان تأكيد البريد مفعلاً
*/

if(!data.session){

toast(
'الحساب انعمل، لكن Supabase يطلب تأكيد البريد. عطّل Confirm email من Authentication → Providers → Email.',
true
);

return;

}


/* CREATE PROFILE */

await createProfile(
data.user,
name
);

toast(
'تم إنشاء الحساب بنجاح 🚀'
);

}catch(error){

console.error(error);

let message=
error?.message ||
'حدث خطأ غير متوقع.';

if(
message.includes('User already registered')
){

message=
'اسم المستخدم مستخدم مسبقاً. جرّب اسماً آخر.';

}

toast(
message,
true
);

}finally{

loading(false);

}

}

.on(

{
event:'INSERT',
schema:'public',
table:'messages',
filter:
'room_id=eq.'+
currentRoom.id
},
async payload=>{

const {
data
}=
await sb
.from('messages')
.select(`
id,
room_id,
user_id,
body,
image_url,
created_at,
profiles(
username,
avatar_url,

payload.new.id
)

}

async function refreshProfileActions(){

if(!selectedProfile)return;

const uid=
selectedProfile.id;


const [
likesResult,
likedResult,
friendResult
]=await Promise.all([

sb
.from('profile_likes')
.select('*',{count:'exact',head:true})
.eq(
'profile_id',
uid
),

sb
.from('profile_likes')
.select('id')
.eq(
'profile_id',
uid
)
.eq(
'user_id',
currentUser.id
)
.maybeSingle(),

sb
.from('friendships')
.select('id,status,requester_id,addressee_id')
.or(
`and(requester_id.eq.${currentUser.id},addressee_id.eq.${uid}),and(requester_id.eq.${uid},addressee_id.eq.${currentUser.id})`
)
.maybeSingle()

]);


$('likeCount').textContent=
likesResult.count||0;


$('likeBtn').disabled=
uid===currentUser.id;


const friend=
friendResult.data;


if(!friend){

$('friendBtn').textContent=
'➕ صداقة';

}else if(
friend.status==='accepted'
){

$('friendBtn').textContent=
'✓ أصدقاء';

}else if(
friend.requester_id===currentUser.id
){

$('friendBtn').textContent=
'⏳ طلب مرسل';

}else{

$('friendBtn').textContent=
'✓ قبول الصداقة';

}

}
