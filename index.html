<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Chat - دردشة عشوائية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #334155; color: #fff; margin-bottom: 10px; }
        button { background: #0ea5e9; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #0284c7; }
        #chat-box { height: 300px; background: #0f172a; border-radius: 6px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; border: 1px solid #334155; }
        .message { margin-bottom: 8px; padding: 6px 10px; background: #334155; border-radius: 4px; font-size: 14px; }
        .message span { font-weight: bold; color: #38bdf8; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>راندو تشات</h2>
    
    <div id="setup-screen">
        <div class="input-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="username" placeholder="اكتب اسمك هنا...">
        </div>
        <div class="input-group">
            <label>رقم الغرفة:</label>
            <input type="number" id="room-id" value="1" placeholder="رقم الغرفة">
        </div>
        <button onclick="startChat()">دخول للدردشة</button>
    </div>

    <div id="chat-screen" style="display: none;">
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="message-input" placeholder="اكتب رسالتك...">
        </div>
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // ضع بيانات Supabase هنا
    const SUPABASE_URL = 'ضع_رابط_المشروع_هنا';
    const SUPABASE_ANON_KEY = 'ضع_المفتاح_العام_هنا';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUsername = '';
    let currentRoom = 1;

    function startChat() {
        const user = document.getElementById('username').value.trim();
        const room = document.getElementById('room-id').value;

        if (!user) {
            alert('الرجاء إدخال اسم المستخدم!');
            return;
        }

        currentUsername = user;
        currentRoom = parseInt(room);

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'block';

        fetchMessages();
        
        // استقبال الرسائل الفورية
        supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                if (payload.new.room_id === currentRoom) {
                    appendMessage(payload.new);
                }
            })
            .subscribe();
    }

    async function fetchMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .eq('room_id', currentRoom)
            .order('created_at', { ascending: true });

        if (error) {
            console.error('خطأ بجلب الرسائل:', error);
            return;
        }

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        data.forEach(msg => appendMessage(msg));
    }

    function appendMessage(msg) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<span>${msg.username}:</span> ${msg.content}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const content = input.value.trim();

        if (!content) return;

        const { error } = await supabase
            .from('messages')
            .insert([{ room_id: currentRoom, username: currentUsername, content: content }]);

        if (error) {
            alert('فشل إرسال الرسالة: ' + error.message);
        } else {
            input.value = '';
        }
    }
</script>

</body>
</html>
