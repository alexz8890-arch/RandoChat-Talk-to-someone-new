<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الشات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .login-container input, 
        .login-container select, 
        .login-container button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .login-container button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .login-container button:hover {
            background: #0056b3;
        }
        #chat-room {
            display: none;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول -->
    <div class="login-container" id="loginBox">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <!-- اسم المستخدم -->
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
            
            <!-- كلمة السر تحت اسم المستخدم مباشرة -->
            <input type="password" id="password" placeholder="كلمة السر (للأدمن علي فقط)" autocomplete="off">
            
            <!-- خيارات الجنس -->
            <select id="gender">
                <option value="" disabled selected>حدد الجنس</option>
                <option value="male">ذكر</option>
                <option value="female">أنثى</option>
                <option value="prefer_not_to_say">لا أرغب بالقول</option>
                <option value="homosexual">مثلي الجنس</option>
            </select>
            
            <!-- زر الدخول -->
            <button type="submit" id="loginBtn">دخول</button>
        </form>
    </div>

    <!-- واجهة الشات بعد الدخول -->
    <div id="chat-room">
        <h2>مرحباً بك في الغرفة</h2>
        <p id="welcomeMsg" style="font-size: 18px; color: #555;"></p>
        <div id="adminControls" style="display:none; margin-top: 20px;">
            <button style="background: #dc3545; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">🔓 فك الطرد</button>
        </div>
    </div>

    <script>
        // كلمة السر الخاصة بالمالك (علي)
        const ADMIN_PASSWORD = 'AlIXhiussam$@37274#@$jdke72gx83$';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const genderSelect = document.getElementById('gender').value;

            // التحقق من تعبئة اسم المستخدم
            if (usernameInput === "") {
                alert("الرجاء إدخال اسم المستخدم!");
                return;
            }

            // التحقق من اختيار الجنس
            if (!genderSelect) {
                alert("الرجاء تحديد الجنس!");
                return;
            }

            // إذا كان المستخدم المدخل هو "علي"
            if (usernameInput === "علي") {
                if (passwordInput === ADMIN_PASSWORD) {
                    alert("مرحباً بك أيها المالك (علي)");
                    enterChat(usernameInput, true);
                } else {
                    alert("كلمة السر الخاصة بالمالك خاطئة!");
                    return;
                }
            } else {
                // دخول مستخدم عادي
                enterChat(usernameInput, false);
            }
        });

        function enterChat(username, isAdmin) {
            // إخفاء صندوق تسجيل الدخول وإظهار الشات
            document.getElementById('loginBox').style.display = 'none';
            const chatRoom = document.getElementById('chat-room');
            chatRoom.style.display = 'block';
            document.getElementById('welcomeMsg').innerText = `أهلاً بك، ${username}`;
            
            // إذا كان المستخدم أدمن، نظهر له صلاحيات المالك
            if (isAdmin) {
                document.getElementById('adminControls').style.display = 'block';
            }
        }
    </script>
</body>
</html>
