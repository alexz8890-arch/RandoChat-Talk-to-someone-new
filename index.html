<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راندو تشات VIP - النسخة المحدثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.95);
            --primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0284c7, #2563eb);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bubble-me: #0284c7;
            --bubble-other: #1e293b;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 80%); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }

        .app-container {
            width: 100%; max-width: 460px; height: 95vh;
            background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); border-radius: 24px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); position: relative;
        }

        .screen { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 18px; overflow-y: auto; }
        .hidden { display: none !important; }

        .welcome-title { text-align: center; font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .welcome-sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-glass); border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
        textarea { resize: none; height: 65px; }

        .avatar-upload-box { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 12px; }
        .avatar-preview { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; }
        .file-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-glass); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }

        .btn-primary { width: 100%; padding: 12px; background: var(--accent-gradient); border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-glass); margin-bottom: 12px; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .user-avatar-small { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary); }

        .room-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-glass); padding: 14px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; }

        .messages-box { flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; position: relative; }
        .msg-me { align-self: flex-start; background: var(--bubble-me); color: #fff; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-end; background: var(--bubble-other); color: #fff; border-bottom-left-radius: 4px; border: 1px solid var(--border-glass); }

        .msg-user-info { display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 4px; }
        .msg-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .msg-img { max-width: 100%; border-radius: 10px; margin-top: 6px; }

        .chat-input-bar { display: flex; gap: 6px; padding-top: 10px; align-items: center; }
        .icon-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-glass); width: 40px; height: 40px; border-radius: 10px; color: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; }

        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 99; }
        .profile-card { background: #1e293b; border: 1px solid var(--border-glass); width: 100%; max-width: 350px; border-radius: 20px; padding: 18px; text-align: center; max-height: 88vh; overflow-y: auto; }
        .profile-card img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 8px; object-fit: cover; }
        
        .bio-box { background: rgba(15, 23, 42, 0.6); padding: 8px 12px; border-radius: 10px; font-size: 12px; color: var(--text-muted); margin: 8px 0; border: 1px dashed var(--border-glass); }

        .btn-friend { background: #3b82f6; color: #fff; border: none; padding: 10px; border-radius: 10px; margin-top: 6px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-like { background: #ec4899; color: #fff; border: none; padding: 8px; border-radius: 10px; margin-top: 6px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-kick { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 10px; margin-top: 6px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-dm { background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 10px; margin-top: 6px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-mod { background: #8b5cf6; color: #fff; border: none; padding: 10px; border-radius: 10px; margin-top: 6px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-action { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px; border-radius: 8px; margin-top: 6px; width: 100%; cursor: pointer; }

        .post-item { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-glass); padding: 10px; border-radius: 12px; margin-top: 8px; text-align: right; font-size: 13px; }

        .call-card { text-align: center; color: #fff; }
        .pulse-call { animation: pulse 1.5s infinite; width: 100px; height: 100px; border-radius: 50%; margin: 20px auto; border: 4px solid #10b981; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1. شاشة إنشاء الملف الشخصي -->
    <div id="screen-welcome" class="screen">
        <div class="welcome-title">راندو تشات ⚡</div>
        <div class="welcome-sub">أنشئ ملفك الشخصي وابدأ التواصل</div>

        <div class="avatar-upload-box">
            <img id="preview-avatar" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest">
            <label>
                <input type="file" id="input-avatar-file" accept="image/*" style="display:none;" onchange="handleAvatarFile(this)">

        <div style="display: flex; gap: 10px;">

            <div class="form-group" style="flex:1;">
                <label>الجنس:</label>

                    <option value="" disabled selected>اختر الجنس</option>
                    <option value="ذكر">ذكر ♂</option>

                    <option value="مثلي الجنس">مثلي الجنس</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>البلد (الدولة):</label>
            <select id="input-country">
                <option value="🇸🇾 سوريا">🇸🇾 سوريا</option>
                <option value="🇸🇦 السعودية">🇸🇦 السعودية</option>
                <option value="🇪🇬 مصر">🇪🇬 مصر</option>
                <option value="🇮🇶 العراق">🇮🇶 العراق</option>
                <option value="🇦🇪 الإمارات">🇦🇪 الإمارات</option>
                <option value="🇱🇧 لبنان">🇱🇧 لبنان</option>
                <option value="🇯🇴 الأردن">🇯🇴 الأردن</option>
                <option value="🇵🇸 فلسطين">🇵🇸 فلسطين</option>
                <option value="🇰🇼 الكويت">🇰🇼 الكويت</option>
                <option value="🇶🇦 قطر">🇶🇦 قطر</option>
                <option value="🇧🇭 البحرين">🇧🇭 البحرين</option>
                <option value="🇴🇲 عمان">🇴🇲 عمان</option>
                <option value="🇾🇪 اليمن">🇾🇪 اليمن</option>
                <option value="🇩🇿 الجزائر">🇩🇿 الجزائر</option>
                <option value="🇲🇦 المغرب">🇲🇦 المغرب</option>
                <option value="🇹🇳 تونس">🇹🇳 تونس</option>
                <option value="🇱🇾 ليبيا">🇱🇾 ليبيا</option>
                <option value="🇸🇩 السودان">🇸🇩 السودان</option>
                <option value="🇹🇷 تركيا">🇹🇷 تركيا</option>
                <option value="🇩🇪 ألمانيا">🇩🇪 ألمانيا</option>
                <option value="🇸🇪 السويد">🇸🇪 السويد</option>
                <option value="🇺🇸 أمريكا">🇺🇸 أمريكا</option>
                <option value="🇬🇧 بريطانيا">🇬🇧 بريطانيا</option>
                <option value="🇫🇷 فرنسا">🇫🇷 فرنسا</option>
                <option value="🇨🇦 كندا">🇨🇦 كندا</option>
                <option value="🇷🇺 روسيا">🇷🇺 روسيا</option>
                <option value="🇳🇱 هولندا">🇳🇱 هولندا</option>
                <option value="🇦🇺 أستراليا">🇦🇺 أستراليا</option>
                <option value="🌐 دولة أخرى">🌐 دولة أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label>الوصف الشخصي (البايو):</label>
            <textarea id="input-bio" placeholder="اكتب شيئاً عن نفسك..."></textarea>
        </div>

        <button class="btn-primary" onclick="saveProfileAndGo()">دخول المنصة 🚀</button>
    </div>

    <!-- 2. شاشة الغرف -->
    <div id="screen-lobby" class="screen hidden">
        <div class="header-bar">
            <div class="user-badge" onclick="openMyOwnProfile()">

        </div>

        <div style="margin-bottom: 12px; font-weight: 700; font-size: 14px; color: var(--text-muted);">اختر غرفة للدردشة:</div>

            </div>
            <span style="color:#4ade80; font-size:12px;">● متصل</span>
        </div>
    </div>

    <!-- 3. شاشة الدردشة الرئيسية -->
    <div id="screen-chat" class="screen hidden">
        <div class="header-bar">
            <div>
                <h4 id="chat-room-title">الغرفة العامة</h4>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="file-btn" style="background:#ef4444;" onclick="clearChatUI()">🗑️ مسح</button>
                <button class="file-btn" onclick="leaveRoom()">مغادرة 🚪</button>

        </div>

        <div id="messages-box" class="messages-box"></div>

        <div class="chat-input-bar">
            <label class="icon-btn" title="إرسال صورة">

            </label>
            <button class="icon-btn" onclick="insertEmoji('😊')">😊</button>
            <input type="text" id="chat-input-msg" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="btn-primary" style="width:50px;" onclick="sendChatMessage()">➤</button>
        </div>
    </div>

    <!-- 4. شاشة المحادثة الخاصة (DM) -->
    <div id="screen-dm" class="screen hidden">
        <div class="header-bar">
            <div class="user-badge">

            </div>
            <div style="display:flex; gap:6px;">

            </div>
        </div>

        <div id="dm-messages-box" class="messages-box"></div>

        <div class="chat-input-bar">
            <label class="icon-btn" title="إرسال صورة">
                <input type="file" accept="image/*" style="display:none;" onchange="sendImageMsg(this, true)">
                📷
            </label>
            <button id="btn-record-voice" class="icon-btn" title="فويس" onclick="toggleVoiceRecord()">🎙️</button>
            <input type="text" id="dm-input-msg" placeholder="اكتب بالخاص..." onkeydown="if(event.key==='Enter') sendPrivateMessage()">
            <button class="btn-primary" style="width:50px;" onclick="sendPrivateMessage()">➤</button>
        </div>
    </div>

    <!-- 5. نافذة البروفايل المتقدمة (Modal) -->
    <div id="modal-profile" class="modal-overlay hidden">
        <div class="profile-card">
            <img id="modal-img" src="">
            <h3 id="modal-name"></h3>
            <p id="modal-details" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></p>
            
            <div id="modal-bio" class="bio-box">لا يوجد وصف شخصي بعد.</div>

            <button id="btn-like-profile" class="btn-like" onclick="likeCurrentProfile()">❤️ إعجاب بالبروفايل (<span id="profile-likes-count">0</span>)</button>
            <button id="btn-add-friend" class="btn-friend" onclick="handleFriendAction()">➕ إضافة صديق</button>
            <button id="btn-open-dm" class="btn-dm hidden" onclick="startPrivateChatFromModal()">مراسلة على الخاص 💬</button>
            
            <button id="btn-make-mod" class="btn-mod hidden" onclick="makeModSelectedUser()">تعيين كمشرف 🛡️</button>
            <button id="btn-kick-user" class="btn-kick hidden" onclick="kickSelectedUser()">طرد من الغرفة 🚫</button>

            <div style="margin-top:14px; border-top:1px solid var(--border-glass); padding-top:10px; text-align:right;">
                <h5 style="color:var(--primary); margin-bottom:6px;">📌 المنشورات:</h5>
                <div id="my-post-input-box" class="hidden">
                    <input type="text" id="input-new-post" placeholder="اكتب منشوراً جديداً..." style="font-size:12px; margin-bottom:4px;">
                    <button class="btn-primary" style="padding:6px; font-size:12px;" onclick="createNewPost()">نشر 📝</button>
                </div>
                <div id="profile-posts-list"></div>
            </div>

            <button class="btn-action" onclick="closeProfileModal()">إغلاق</button>
        </div>
    </div>

    <!-- 6. نافذة المكالمة -->
    <div id="modal-call" class="modal-overlay hidden">
        <div class="profile-card call-card">
            <h3>مكالمة جارية...</h3>
            <img id="call-user-img" class="pulse-call" src="">
            <h4 id="call-user-name"></h4>
            <p style="color:#10b981; margin:10px 0;">متصل الآن 🎙️</p>
            <button class="btn-kick" onclick="endCall()">إنهاء المكالمة 🚫</button>
        </div>
    </div>

</div>
