<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      outline: none;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .rooms {
      margin-top: 25px;
      display: grid;
      gap: 10px;
    }

    .room {
      background: #334155;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .room:hover {
      background: #475569;
      transform: translateY(-2px);
    }

    .status {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">💬 Random Chat</div>

    <div class="subtitle">
      تعرّف على أشخاص جدد وتحدث معهم
    </div>

    <div class="card">

      <h2>ابدأ الدردشة</h2>

      <input
        type="text"
        id="username"
        placeholder="اكتب اسمك..."
        maxlength="30"
      >

      <button onclick="startChat()">
        دخول إلى الدردشة
      </button>

      <div class="rooms">

        <div class="room" onclick="selectRoom('العامة')">
          💬 العامة
        </div>

        <div class="room" onclick="selectRoom('تعارف')">
          ❤️ تعارف
        </div>

        <div class="room" onclick="selectRoom('أصدقاء')">
          👥 أصدقاء
        </div>

      </div>

      <div class="status" id="status">
        جاهز للبدء
      </div>

    </div>

  </div>

  <script>
    let selectedRoom = "العامة";

    function selectRoom(room) {
      selectedRoom = room;

      document.getElementById("status").textContent =
        "الغرفة المختارة: " + room;
    }

    function startChat() {
      const username =
        document.getElementById("username").value.trim();

      if (!username) {
        alert("اكتب اسمك أولاً");
        return;
      }

      document.getElementById("status").textContent =
        "مرحباً " + username + " 👋 — الغرفة: " + selectedRoom;

      console.log({
        username: username,
        room: selectedRoom
      });
    }
  </script>

</body>
          </html>
